[project]
name = "nmck-backend"
version = "0.1.0"
description = "Локальный бэкенд агента обоснования НМЦК"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.32,<1",
    "httpx>=0.28,<1",
    "PyYAML>=6,<7",
    "python-docx>=1.2,<2",
    "pypdf>=6,<7",
    "jsonschema>=4.23,<5",
    "selectolax>=0.3,<1",
    "python-multipart>=0.0.20,<1",
    "playwright>=1.55,<2",
    "websockets>=14,<17",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "app/default_config"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
